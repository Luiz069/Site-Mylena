<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colecionáveis - Escolha seu Perfil</title>

    <link rel="stylesheet" href="colecionavel.css" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
</head>

<body>
    <!-- 1. TELA DE SELEÇÃO INICIAL -->
    <div id="profileSelectionScreen">
        <h2 class="screen-title">Quem está acessando?</h2>
        <div class="profiles-grid" id="initialProfilesGrid"></div>
    </div>

    <!-- 2. CABEÇALHO DA APLICAÇÃO -->
    <header>
        <div class="header-left">
            <button id="backButton">
                <i class="bi bi-arrow-left"></i>
            </button>
            <h1>Colecionáveis</h1>
        </div>

        <div class="header-right">
            <button id="profileButton">
                <img id="headerAvatarImg" src="" alt="Avatar" />
            </button>
        </div>

        <div id="profileMenu">
            <h2>Perfil</h2>
            <div id="profileContainer"></div>

            <div id="addProfileMenuBtn">
                <i class="bi bi-plus-circle"></i>
                <span>Adicionar perfil</span>
            </div>

            <div id="switchProfileScreenBtn">
                <i class="bi bi-people"></i>
                <span>Trocar de perfil</span>
            </div>
        </div>
    </header>

    <hr class="linha-header">

    <section class="barra-ferramenta">
        <div class="search-box">
            <input type="text" placeholder="Type to search.." />
            <div class="search-icon">
                <i class="fas fa-search search-fechado"></i>
            </div>
            <div class="cancel-icon">
                <i class="fas fa-times"></i>
            </div>
            <div class="search-data"></div>
        </div>

        <div class="add-item">
            <button class="btn-add"">
                <i class=" bi bi-plus-circle btn-add-icon"></i>
            </button>
        </div>
    </section>

    <!-- ================================================================================= -->

    <!-- 3. MODAL DE CRIAÇÃO / EDIÇÃO DE PERFIL -->
    <div class="modal-overlay" id="createProfileModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Novo Perfil</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>

            <div class="form-group">
                <label for="profileNameInput">Nome do Perfil</label>
                <input type="text" id="profileNameInput" class="form-input" placeholder="Ex: Maria" maxlength="20" />
            </div>

            <div class="form-group">
                <label>Escolha um Avatar</label>
                <div class="avatar-categories" id="avatarCategories">
                    <button class="category-btn active" data-style="lorelei">
                        Lorelei
                    </button>
                    <button class="category-btn" data-style="pixel-art">
                        Pixel Art
                    </button>
                    <button class="category-btn" data-style="bottts">Robôs</button>
                    <button class="category-btn" data-style="adventurer">
                        Aventureiros
                    </button>
                </div>
                <div class="avatar-grid" id="avatarGrid"></div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelModalBtn">Cancelar</button>
                <button class="btn btn-save" id="saveProfileBtn">Salvar</button>
            </div>
        </div>
    </div>

    <!-- 4. MODAL DE CONFIRMAÇÃO DE EXCLUSÃO -->
    <div class="modal-overlay" id="deleteConfirmModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Excluir Perfil</h3>
                <button class="modal-close" id="closeDeleteModalBtn">&times;</button>
            </div>
            <p style="color: #666; font-size: 14px">
                Tem certeza que deseja excluir o perfil
                <b id="deleteProfileNameText"></b>? Esta ação removerá a coleção
                associada a ele permanentemente.
            </p>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="cancelDeleteBtn">Cancelar</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Excluir</button>
            </div>
        </div>
    </div>

    <!-- ================================================================================= -->

    <script src="colecionavel.js" type="module"></script>
</body>

</html>
