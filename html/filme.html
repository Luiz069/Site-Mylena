<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineCasal - Dashboard</title>

  <!-- Fontes e Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* =========================================================

       VARIÁVEIS E TEMA (DARK / LIGHT)

       ========================================================= */

    :root {
      --bg-gradient: linear-gradient(135deg, #0d0b18 0%, #050409 100%);

      --card-bg: rgba(255, 255, 255, 0.03);

      --glass-border: rgba(255, 255, 255, 0.08);

      --input-bg: rgba(255, 255, 255, 0.05);

      --text-main: #ffffff;

      --text-muted: #9e9ea0;

      --accent: #ff3c00;

      --accent-hover: #ff5522;

      --radius-lg: 18px;

      --radius-md: 12px;

      --radius-sm: 8px;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    body.light-mode {
      --bg-gradient: linear-gradient(135deg, #f4f5f9 0%, #e2e4ed 100%);

      --card-bg: #ffffff;

      --glass-border: rgba(0, 0, 0, 0.08);

      --input-bg: #f0f2f5;

      --text-main: #111827;

      --text-muted: #6b7280;

      --shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    * {
      margin: 0;

      padding: 0;

      box-sizing: border-box;

      font-family: "Plus Jakarta Sans", sans-serif;

      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);

      color: var(--text-main);

      min-height: 100vh;

      padding-bottom: 40px;

      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    .wrapper {
      width: 100%;

      max-width: 1200px;

      margin: 0 auto;

      padding: 0 16px;
    }

    /* =========================================================

       NAVBAR / HEADER

       ========================================================= */

    nav {
      background: rgba(13, 11, 24, 0.8);

      backdrop-filter: blur(16px);

      -webkit-backdrop-filter: blur(16px);

      border-bottom: 1px solid var(--glass-border);

      position: sticky;

      top: 0;

      z-index: 100;

      margin-bottom: 24px;
    }

    body.light-mode nav {
      background: rgba(244, 245, 249, 0.85);
    }

    .nav-container {
      display: flex;

      align-items: center;

      justify-content: space-between;

      height: 60px;
    }

    .logo {
      font-weight: 800;

      font-size: 1.2rem;

      display: flex;

      align-items: center;

      gap: 8px;

      color: var(--text-main);

      letter-spacing: -0.5px;
    }

    .logo i {
      color: var(--accent);
    }

    .nav-tabs {
      display: flex;

      gap: 4px;

      background: var(--input-bg);

      padding: 4px;

      border-radius: 30px;

      border: 1px solid var(--glass-border);
    }

    .nav-tab-btn {
      background: transparent;

      border: none;

      color: var(--text-muted);

      padding: 6px 14px;

      border-radius: 20px;

      font-weight: 600;

      font-size: 0.82rem;

      cursor: pointer;

      display: flex;

      align-items: center;

      gap: 6px;

      transition: all 0.2s ease;
    }

    .nav-tab-btn.active {
      background: var(--accent);

      color: #fff;

      box-shadow: 0 4px 12px rgba(255, 60, 0, 0.3);
    }

    .icon-btn {
      background: var(--input-bg);

      border: 1px solid var(--glass-border);

      color: var(--text-main);

      width: 36px;

      height: 36px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      transition: all 0.2s;

      font-size: 0.9rem;
    }

    .icon-btn:hover {
      transform: scale(1.05);
    }

    /* =========================================================

       DASHBOARD VIEWS (ABAS)

       ========================================================= */

    .dashboard-view {
      display: none;

      animation: fadeIn 0.25s ease-in-out;
    }

    .dashboard-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;

        transform: translateY(6px);
      }

      to {
        opacity: 1;

        transform: translateY(0);
      }
    }

    /* =========================================================

       PAINÉIS DE FORMULÁRIO E FILTROS

       ========================================================= */

    .add-movie-panel {
      background: var(--card-bg);

      border: 1px solid var(--glass-border);

      border-radius: var(--radius-lg);

      padding: 16px;

      margin-bottom: 20px;

      position: relative;

      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;

      grid-template-columns: 1fr 150px 80px 120px;

      gap: 10px;

      position: relative;
    }

    .input-group {
      position: relative;
    }

    input,
    select {
      width: 100%;

      height: 40px;

      background: var(--input-bg);

      border: 1px solid var(--glass-border);

      border-radius: var(--radius-sm);

      padding: 0 12px;

      color: var(--text-main);

      font-size: 0.88rem;

      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);

      color: #fff;

      border: none;

      border-radius: var(--radius-sm);

      font-weight: 700;

      font-size: 0.85rem;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      transition: all 0.2s;

      height: 40px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Dropdown Auto-complete */

    .search-results-dropdown {
      position: absolute;

      top: 46px;

      left: 0;

      right: 0;

      background: var(--card-bg);

      backdrop-filter: blur(25px);

      -webkit-backdrop-filter: blur(25px);

      border: 1px solid var(--glass-border);

      border-radius: var(--radius-sm);

      max-height: 240px;

      overflow-y: auto;

      z-index: 50;

      display: none;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .search-result-item {
      display: flex;

      align-items: center;

      gap: 10px;

      padding: 8px 12px;

      cursor: pointer;

      border-bottom: 1px solid var(--glass-border);

      font-size: 0.85rem;
    }

    .search-result-item:hover {
      background: var(--input-bg);
    }

    .search-result-item img {
      width: 30px;

      height: 44px;

      object-fit: cover;

      border-radius: 4px;
    }

    /* Filtros da Lista */

    .list-controls {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

      gap: 12px;

      flex-wrap: wrap;
    }

    .filter-buttons {
      display: flex;

      gap: 6px;
    }

    .filter-btn {
      background: var(--input-bg);

      border: 1px solid var(--glass-border);

      color: var(--text-muted);

      padding: 6px 12px;

      border-radius: var(--radius-sm);

      font-weight: 600;

      font-size: 0.8rem;

      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--text-main);

      color: #000;

      border-color: var(--text-main);
    }

    .search-bar-list {
      position: relative;

      width: 220px;
    }

    .search-bar-list input {
      height: 34px;

      font-size: 0.82rem;
    }

    /* =========================================================

       GRID E CARDS

       ========================================================= */

    .movie-grid {
      display: grid;

      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));

      gap: 16px;
    }

    .movie-card {
      background: var(--card-bg);

      border: 1px solid var(--glass-border);

      border-radius: var(--radius-md);

      overflow: hidden;

      display: flex;

      flex-direction: column;

      box-shadow: var(--shadow);

      transition:
        transform 0.2s,
        border-color 0.2s;
    }

    .movie-card:hover {
      transform: translateY(-4px);

      border-color: rgba(255, 255, 255, 0.2);
    }

    .poster-container {
      position: relative;

      width: 100%;

      aspect-ratio: 2 / 3;

      overflow: hidden;

      background: var(--input-bg);
    }

    .poster-container img {
      width: 100%;

      height: 100%;

      object-fit: cover;
    }

    .movie-info {
      padding: 10px;

      display: flex;

      flex-direction: column;

      gap: 8px;

      flex-grow: 1;

      justify-content: space-between;
    }

    .movie-info h3 {
      font-size: 0.85rem;

      font-weight: 700;

      line-height: 1.25;

      display: -webkit-box;

      -webkit-line-clamp: 2;

      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .movie-rating-stars {
      color: gold;

      font-size: 0.75rem;

      margin-top: 2px;

      letter-spacing: 1px;
    }

    .movie-controls {
      display: flex;

      flex-direction: column;

      gap: 6px;

      margin-top: 4px;
    }

    .edit-inputs-row {
      display: flex;

      gap: 4px;
    }

    .edit-inputs-row select {
      flex: 1;

      height: 30px;

      font-size: 0.75rem;

      padding: 0 4px;

      border-radius: 6px;
    }

    .edit-inputs-row input[type="number"] {
      width: 50px;

      height: 30px;

      font-size: 0.75rem;

      padding: 0 4px;

      border-radius: 6px;

      text-align: center;
    }

    .button-group {
      display: flex;

      gap: 4px;
    }

    .btn-card {
      flex: 1;

      height: 30px;

      border-radius: 6px;

      border: 1px solid var(--glass-border);

      background: var(--input-bg);

      color: var(--text-main);

      font-size: 0.75rem;

      font-weight: 600;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 4px;
    }

    .btn-card.edit:hover {
      background: #28a745;

      color: white;

      border-color: #28a745;
    }

    .btn-card.watch {
      background: var(--accent);

      border: none;

      color: white;
    }

    .btn-card.remove:hover {
      background: #dc3545;

      color: white;

      border-color: #dc3545;
    }

    .btn-already-added {
      background: #28a745 !important;

      color: white !important;

      opacity: 0.85;

      cursor: default !important;
    }

    /* =========================================================

       GÊNEROS / DESCOBRIR

       ========================================================= */

    .genres-grid {
      display: grid;

      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));

      gap: 8px;

      margin-bottom: 16px;
    }

    .genre-chip {
      background: var(--input-bg);

      border: 1px solid var(--glass-border);

      color: var(--text-main);

      padding: 8px;

      border-radius: var(--radius-sm);

      cursor: pointer;

      font-weight: 600;

      font-size: 0.78rem;

      text-align: center;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 4px;

      transition: all 0.2s;
    }

    .genre-chip.active {
      background: var(--accent);

      border-color: var(--accent);

      color: white;
    }

    .status-box {
      text-align: center;

      padding: 40px 20px;

      color: var(--text-muted);

      font-size: 0.9rem;
    }

    .status-box i {
      font-size: 2rem;

      margin-bottom: 8px;

      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .btn-primary {
        grid-column: span 2;
      }

      .search-bar-list {
        width: 100%;
      }

      .list-controls {
        flex-direction: column;

        align-items: stretch;
      }

      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));

        gap: 10px;
      }
    }

    /* ================================ */

    /* Fundo escuro do modal */

    .player-overlay {
      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.92);

      backdrop-filter: blur(8px);
    }

    /* Caixa do player */

    .player-container {
      position: relative;

      width: min(100%, 1000px);

      max-height: 95vh;

      overflow-y: auto;

      padding: 18px;

      background: #111;

      border: 1px solid #333;

      border-radius: 16px;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);

      color: #fff;
    }

    .player-topo {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 14px;
    }

    .player-topo h2 {
      margin: 0;

      font-size: 18px;

      color: #fff;
    }

    .player-fechar {
      flex-shrink: 0;

      width: 42px;

      height: 42px;

      border: none;

      border-radius: 50%;

      background: #e50914;

      color: #fff;

      font-size: 30px;

      line-height: 1;

      cursor: pointer;
    }

    .player-fechar:hover {
      background: #ff2833;
    }

    #videoMoto {
      display: block;

      width: 100%;

      max-height: 75vh;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 10px;
    }

    #playerMensagem {
      margin: 12px 0 0;

      color: #ccc;

      font-size: 14px;
    }

    @media (max-width: 600px) {
      .player-overlay {
        padding: 10px;
      }

      .player-container {
        padding: 12px;

        border-radius: 12px;
      }

      #videoMoto {
        max-height: 70vh;
      }

      .player-topo h2 {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER NAVBAR -->
  <nav>
    <div class="wrapper nav-container">
      <div class="logo">
        <i class="fa-solid fa-film"></i> CineCasal
      </div>

      <div class="nav-tabs">
        <button class="nav-tab-btn active" data-tab="tab-minha-lista">
          <i class="fa-solid fa-list-check"></i> Lista
        </button>
        <button class="nav-tab-btn" data-tab="tab-descobrir">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Descobrir
        </button>
      </div>

      <div class="nav-actions">
        <button class="icon-btn" id="dark-light-toggle" title="Alternar Tema">
          <i class="fa-solid fa-moon" id="mode-icon"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="wrapper">

    <!-- ABA 1: MINHA LISTA -->
    <section id="tab-minha-lista" class="dashboard-view active">

      <div class="add-movie-panel">
        <form id="add-movie-form" class="form-grid" onsubmit="return false;">
          <div class="input-group">
            <input type="text" id="name-input" placeholder="Buscar título do filme..." autocomplete="off">
            <div id="movie-search-results" class="search-results-dropdown"></div>
          </div>

          <select id="status-select">
            <option value="proximo">Quero Assistir</option>
            <option value="assistindo">Assistindo</option>
            <option value="assistido">Assistido</option>
          </select>

          <input type="number" id="rating-input" placeholder="Nota" min="0" max="5" value="0" title="Sua nota (0 a 5)">

          <button class="btn-primary" id="add-button">
            <i class="fa-solid fa-plus"></i> Adicionar
          </button>
        </form>
      </div>

      <div class="list-controls">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">Todos</button>
          <button class="filter-btn" data-filter="proximo">Quero Assistir</button>
          <button class="filter-btn" data-filter="assistindo">Assistindo</button>
          <button class="filter-btn" data-filter="assistido">Assistidos</button>
        </div>

        <div class="search-bar-list">
          <input type="text" id="search-list-input" placeholder="Filtrar minha lista...">
        </div>
      </div>

      <div class="movie-grid" id="movie-grid"></div>
    </section>

    <!-- ABA 2: DESCOBRIR -->
    <section id="tab-descobrir" class="dashboard-view">
      <div class="add-movie-panel">
        <h3 style="margin-bottom: 12px; font-size: 0.95rem;">Selecione os gêneros desejados:</h3>

        <div class="genres-grid">
          <div class="genre-chip" data-id="28"><i class="fa-solid fa-gun"></i>Ação</div>
          <div class="genre-chip" data-id="12"><i class="fa-solid fa-compass"></i>Aventura</div>
          <div class="genre-chip" data-id="16"><i class="fa-solid fa-child"></i>Animação</div>
          <div class="genre-chip" data-id="35"><i class="fa-solid fa-face-laugh-beam"></i>Comédia</div>
          <div class="genre-chip" data-id="80"><i class="fa-solid fa-mask"></i>Crime</div>
          <div class="genre-chip" data-id="99"><i class="fa-solid fa-video"></i>Doc</div>
          <div class="genre-chip" data-id="18"><i class="fa-solid fa-masks-theater"></i>Drama</div>
          <div class="genre-chip" data-id="10751"><i class="fa-solid fa-people-roof"></i>Família</div>
          <div class="genre-chip" data-id="14"><i class="fa-solid fa-wand-magic-sparkles"></i>Fantasia</div>
          <div class="genre-chip" data-id="27"><i class="fa-solid fa-ghost"></i>Terror</div>
          <div class="genre-chip" data-id="9648"><i class="fa-solid fa-magnifying-glass"></i>Mistério</div>
          <div class="genre-chip" data-id="10749"><i class="fa-solid fa-heart"></i>Romance</div>
          <div class="genre-chip" data-id="878"><i class="fa-solid fa-shuttle-space"></i>Ficção</div>
          <div class="genre-chip" data-id="53"><i class="fa-solid fa-skull"></i>Suspense</div>
        </div>

        <button class="btn-primary" id="find-discover-btn" style="width: 100%;">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Buscar Sugestões
        </button>
      </div>

      <div id="discover-status" class="status-box">
        <i class="fa-solid fa-popcorn"></i>
        <p>Escolha os gêneros acima para ver recomendações.</p>
      </div>

      <div class="movie-grid" id="discover-results-grid"></div>
    </section>

  </main>



  <div id="modalPlayerMoto" class="player-overlay" style="display: none;">
    <div class="player-container" role="dialog" aria-modal="true" aria-labelledby="playerTitulo">

      <div class="player-topo">
        <h2 id="playerTitulo">Reproduzindo filme</h2>

        <button type="button" class="player-fechar" onclick="fecharPlayerMoto()" aria-label="Fechar vídeo">
          &times;
        </button>
      </div>

      <video id="videoMoto" controls playsinline preload="metadata">
        Seu navegador não suporta reprodução de vídeo.
      </video>

      <p id="playerMensagem" role="status"></p>
    </div>
  </div>



  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getDatabase, ref, push, set, get, update, remove
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const SERVIDOR_URL = "http://100.102.178.27:8000";

    // CONFIGURAÇÕES E CONSTANTES
    const firebaseConfig = {
      apiKey: "AIzaSyCJQZ3Pswe6sdsE35wJux8Dgbw_2PaNNOA",
      authDomain: "filmes-salvos.firebaseapp.com",
      databaseURL: "https://filmes-salvos-default-rtdb.firebaseio.com",
      projectId: "filmes-salvos",
      storageBucket: "filmes-salvos.firebasestorage.app",
      messagingSenderId: "155114516613",
      appId: "1:155114516613:web:f0333b9391a7851ad1b9ec",
    };

    const USER_ID = "USER_ID_DEMO";
    const API_KEY = "29fa8018e3a64630c52814108ebee6fb";
    const BASE_IMAGE_URL = "https://image.tmdb.org/t/p/w300";
    const GOOGLE_API_KEY = "AIzaSyCfx8jZZ9PBUmIdl3OVPNf65SzGWGaCqr0";
    const FOLDER_ID = "1jZa8K1YZ76-DyPiAIuAxOHR15IDiUUiI";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let searchTimeout = null;
    let selectedMovie = null;
    let currentFilter = null;
    let currentSearchQuery = null;
    const selectedGenres = new Set();

    // ELEMENTOS DO DOM
    const nameInput = document.getElementById("name-input");
    const searchResultsDropdown = document.getElementById("movie-search-results");
    const movieGrid = document.getElementById("movie-grid");
    const discoverGrid = document.getElementById("discover-results-grid");
    const discoverStatus = document.getElementById("discover-status");

    // HELPER: OBTÉM SET DE IDS SALVOS DO USUÁRIO NO FIREBASE
    async function getSavedMovieIds() {
      const snapshot = await get(ref(db, `user_movies/${USER_ID}`));
      const savedIds = new Set();
      if (snapshot.exists()) {
        Object.values(snapshot.val()).forEach(m => {
          if (m.tmdb_id) savedIds.add(Number(m.tmdb_id));
        });
      }
      return savedIds;
    }

    let tokenServidor = sessionStorage.getItem("tokenServidor") || "";

    async function obterTokenServidor() {
      if (tokenServidor) return tokenServidor;

      const token = prompt("Digite o token do servidor do Moto E7:");
      if (!token) return null;

      tokenServidor = token.trim();
      sessionStorage.setItem("tokenServidor", tokenServidor);

      return tokenServidor;
    }

    // INTERFACE - GERENCIAMENTO DE ABAS
    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.dashboard-view').forEach(v => v.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // INTERFACE - TEMA (DARK / LIGHT)
    document.getElementById("dark-light-toggle").addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      localStorage.setItem("darkMode", !isLight);
      document.getElementById("mode-icon").className = isLight ? "fa-solid fa-sun" : "fa-solid fa-moon";
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderUserList();
      if (localStorage.getItem("darkMode") === "false") {
        document.body.classList.add("light-mode");
        document.getElementById("mode-icon").className = "fa-solid fa-sun";
      }
    });

    // BUSCA DE TÍTULO VIA AUTOCOMPLETE
    nameInput.addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      if (query.length > 2) {
        searchTimeout = setTimeout(() => searchMoviesTMDB(query), 300);
      } else {
        searchResultsDropdown.style.display = "none";
      }
    });

    async function searchMoviesTMDB(query) {
      const url = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=pt-BR`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        searchResultsDropdown.innerHTML = "";

        if (data.results && data.results.length > 0) {
          data.results.slice(0, 5).forEach((movie) => {
            const item = document.createElement("div");
            item.className = "search-result-item";
            const cover = movie.poster_path ? `${BASE_IMAGE_URL}${movie.poster_path}` : "https://via.placeholder.com/40x60?text=Sem+Capa";
            item.innerHTML = `<img src="${cover}"><span>${movie.title}</span>`;
            item.onclick = () => {
              selectedMovie = { id: movie.id, name: movie.title, cover };
              nameInput.value = movie.title;
              searchResultsDropdown.style.display = "none";
            };
            searchResultsDropdown.appendChild(item);
          });
          searchResultsDropdown.style.display = "block";
        }
      } catch (err) { console.error("Erro no autocomplete:", err); }
    }

    // ADICIONAR FILME MANUALMENTE / VIA BUSCA
    document.getElementById("add-button").addEventListener("click", async (e) => {
      e.preventDefault();
      const inputName = nameInput.value.trim();
      if (!inputName) return alert("Digite o nome de um filme!");

      const newMovie = {
        tmdb_id: selectedMovie ? Number(selectedMovie.id) : Date.now(),
        cover: selectedMovie ? selectedMovie.cover : "https://via.placeholder.com/200x300?text=Sem+Capa",
        name: inputName,
        status: document.getElementById("status-select").value,
        rating: parseInt(document.getElementById("rating-input").value) || 0,
        userId: USER_ID
      };

      try {
        const savedIds = await getSavedMovieIds();
        if (savedIds.has(newMovie.tmdb_id)) {
          return alert("Este filme já está na sua lista!");
        }

        await set(push(ref(db, `user_movies/${USER_ID}`)), newMovie);
        nameInput.value = "";
        document.getElementById("rating-input").value = "0";
        selectedMovie = null;
        renderUserList();
      } catch (err) { console.error("Erro ao salvar filme:", err); }
    });

    // RENDERIZAÇÃO DA LISTA DO USUÁRIO
    async function renderUserList() {
      movieGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; font-size: 0.85rem;">Carregando...</p>`;

      try {
        const snapshot = await get(ref(db, `user_movies/${USER_ID}`));
        if (!snapshot.exists()) {
          movieGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; opacity:0.6; font-size: 0.85rem;">Nenhum filme salvo ainda.</p>`;
          return;
        }

        let movies = Object.entries(snapshot.val()).map(([id, data]) => ({ id, ...data }));

        if (currentFilter) movies = movies.filter(m => m.status === currentFilter);
        if (currentSearchQuery) movies = movies.filter(m => m.name.toLowerCase().includes(currentSearchQuery));

        movieGrid.innerHTML = "";

        movies.forEach((movie) => {
          const rating = Math.min(Math.max(movie.rating || 0, 0), 5);
          const stars = "★".repeat(rating) + "☆".repeat(5 - rating);

          const card = document.createElement("div");
          card.className = "movie-card";
          card.innerHTML = `
            <div class="poster-container">
              <img src="${movie.cover}" alt="${movie.name}">
            </div>
            <div class="movie-info">
              <div>
                <h3>${movie.name}</h3>
                <div class="movie-rating-stars">${stars}</div>
              </div>
              <div class="movie-controls">
                <div class="edit-inputs-row">
                  <select id="status-edit-${movie.id}">
                    <option value="proximo" ${movie.status === "proximo" ? "selected" : ""}>Quero</option>
                    <option value="assistindo" ${movie.status === "assistindo" ? "selected" : ""}>Vendo</option>
                    <option value="assistido" ${movie.status === "assistido" ? "selected" : ""}>Visto</option>
                  </select>
                  <input type="number" id="rating-edit-${movie.id}" min="0" max="5" value="${rating}">
                </div>
                <div class="button-group">
                  <button class="btn-card edit" data-id="${movie.id}" title="Salvar Alterações"><i class="fa-solid fa-floppy-disk"></i></button>
                  <button class="btn-card remove" data-id="${movie.id}" title="Remover"><i class="fa-solid fa-trash"></i></button>
                  <button class="btn-card watch" data-name="${movie.name}" title="Assistir no Drive"><i class="fa-solid fa-play"></i></button>
                </div>
              </div>
            </div>
          `;
          movieGrid.appendChild(card);
        });

        // Eventos dos botões do card
        movieGrid.querySelectorAll('.edit').forEach(b => b.onclick = (e) => updateMovie(e.currentTarget.dataset.id));
        movieGrid.querySelectorAll('.remove').forEach(b => b.onclick = (e) => deleteMovie(e.currentTarget.dataset.id));
        movieGrid.querySelectorAll('.watch').forEach(b => b.onclick = (e) => assistiNoDrive(e.currentTarget.dataset.name, e.currentTarget));

      } catch (err) { console.error("Erro ao renderizar lista:", err); }
    }

    // ATUALIZAR STATUS E AVALIAÇÃO
    async function updateMovie(id) {
      const newStatus = document.getElementById(`status-edit-${id}`).value;
      const rawRating = parseInt(document.getElementById(`rating-edit-${id}`).value);
      const validRating = Math.min(Math.max(isNaN(rawRating) ? 0 : rawRating, 0), 5);

      try {
        await update(ref(db, `user_movies/${USER_ID}/${id}`), { status: newStatus, rating: validRating });
        renderUserList();
      } catch (err) { console.error("Erro ao atualizar filme:", err); }
    }

    // DELETAR FILME
    async function deleteMovie(id) {
      if (confirm("Deseja remover este filme?")) {
        await remove(ref(db, `user_movies/${USER_ID}/${id}`));
        renderUserList();
      }
    }

    // REPRODUÇÃO NO GOOGLE DRIVE


    function normalizarNomeFilme(texto) {
      return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\.[^.]+$/, "") // Remove a extensão do arquivo
        .replace(/[^a-zA-Z0-9]/g, "") // Ignora espaços, :, hífens etc.
        .toLowerCase();
    }

    async function assistiNoDrive(nome, btn) {
      const textoOriginal = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
      btn.disabled = true;

      try {
        const token = await obterTokenServidor();
        if (!token) return;

        // Pesquisa primeiro pelo trecho anterior aos dois-pontos.
        // Ex.: "Homem-Aranha: Um Novo Dia" -> "Homem-Aranha"
        const buscaTermo = nome.split(/[:：]/)[0].trim() || nome;

        const resposta = await fetch(
          `${SERVIDOR_URL}/api/buscar?q=${encodeURIComponent(buscaTermo)}`,
          {
            headers: {
              Authorization: `Bearer ${token}`
            }
          }
        );

        if (resposta.status === 401) {
          tokenServidor = "";
          sessionStorage.removeItem("tokenServidor");
          alert("Token inválido. Clique em Play e tente novamente.");
          return;
        }

        if (!resposta.ok) {
          throw new Error(`Falha na busca: HTTP ${resposta.status}`);
        }

        const dados = await resposta.json();
        const nomeNormalizado = normalizarNomeFilme(nome);

        // Compara o título com os nomes dos arquivos ignorando pontuação.
        const arquivos = dados.resultados || [];

        const filme = arquivos.find(arquivo =>
          normalizarNomeFilme(arquivo.nome) === nomeNormalizado
        ) || arquivos.find(arquivo =>
          normalizarNomeFilme(arquivo.nome).startsWith(nomeNormalizado)
        );

        if (!filme) {
          alert(
            `O vídeo "${nome}" não foi encontrado. ` +
            "Confira se o arquivo está na pasta Movies do Moto E7."
          );
          return;
        }

        // Solicita o ticket temporário com o token já existente.
        const respostaTicket = await fetch(
          `${SERVIDOR_URL}/api/ticket?caminho=${encodeURIComponent(filme.caminho)}`,
          {
            headers: {
              Authorization: `Bearer ${token}`
            }
          }
        );

        if (!respostaTicket.ok) {
          throw new Error(
            `Falha ao autorizar o vídeo: HTTP ${respostaTicket.status}`
          );
        }

        const dadosTicket = await respostaTicket.json();

        const videoUrl =
          `${SERVIDOR_URL}/api/arquivo?caminho=${encodeURIComponent(filme.caminho)}` +
          `&ticket=${encodeURIComponent(dadosTicket.ticket)}`;

        abrirPlayerComToken(videoUrl, filme.nome);

      } catch (erro) {
        console.error("Erro ao reproduzir:", erro);

        alert(
          "Não foi possível abrir o vídeo. Confira se o servidor está online " +
          "e se o computador está conectado ao Tailscale."
        );
      } finally {
        btn.innerHTML = textoOriginal;
        btn.disabled = false;
      }
    }




    function abrirPlayerComToken(url, nome) {
      const modal = document.getElementById("modalPlayerMoto");
      const video = document.getElementById("videoMoto");
      const titulo = document.getElementById("playerTitulo");
      const mensagem = document.getElementById("playerMensagem");

      titulo.textContent = nome || "Reproduzindo filme";
      mensagem.textContent = "Conectando ao servidor do Moto E7...";

      modal.style.display = "flex";
      document.body.style.overflow = "hidden";

      video.pause();
      video.removeAttribute("src");
      video.load();

      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";

      video.onwaiting = () => {
        mensagem.textContent = "Carregando vídeo...";
      };

      video.onloadedmetadata = () => {
        mensagem.textContent = "Vídeo carregado. Toque em Play para assistir.";
      };

      video.onplaying = () => {
        mensagem.textContent = "";
      };

      video.oncanplay = () => {
        mensagem.textContent = "Pronto para reproduzir.";
      };

      video.onerror = () => {
        const erro = video.error;
        const codigos = {
          1: "O carregamento foi cancelado.",
          2: "Falha de rede ao receber o vídeo.",
          3: "Formato ou codec não compatível com o Chrome.",
          4: "O vídeo não pôde ser carregado neste navegador."
        };

        mensagem.textContent =
          codigos[erro?.code] ||
          "Não foi possível carregar o vídeo. Verifique a conexão com o servidor.";
      };

      video.src = url;
      video.load();

      // No celular, deixe o usuário iniciar com um toque explícito.
    }


    function fecharPlayerMoto() {
      const modal = document.getElementById("modalPlayerMoto");
      const video = document.getElementById("videoMoto");
      const mensagem = document.getElementById("playerMensagem");

      video.pause();
      video.removeAttribute("src");
      video.load();

      modal.style.display = "none";
      document.body.style.overflow = "";
      mensagem.textContent = "";
    }

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        fecharPlayerMoto();
      }
    });

    document.getElementById("modalPlayerMoto").addEventListener("click", function (event) {
      if (event.target === this) {
        fecharPlayerMoto();
      }
    });
    s



    // FILTROS E BUSCA NA LISTA LOCAL
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter === "all" ? null : btn.dataset.filter;
        renderUserList();
      };
    });

    document.getElementById("search-list-input").addEventListener("input", (e) => {
      currentSearchQuery = e.target.value.toLowerCase().trim();
      renderUserList();
    });

    // SELEÇÃO DE GÊNEROS E BUSCA EXPANDIDA DA ABA DESCOBRIR
    document.querySelectorAll('.genre-chip').forEach(chip => {
      chip.onclick = () => {
        const id = chip.dataset.id;
        if (selectedGenres.has(id)) {
          selectedGenres.delete(id);
          chip.classList.remove('active');
        } else {
          selectedGenres.add(id);
          chip.classList.add('active');
        }
      };
    });

    document.getElementById('find-discover-btn').onclick = async () => {
      if (selectedGenres.size === 0) return alert("Selecione pelo menos uma categoria!");

      discoverGrid.innerHTML = "";
      discoverStatus.style.display = "block";
      discoverStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><p>Buscando dezenas de sugestões...</p>`;

      const ids = Array.from(selectedGenres).join(',');

      try {
        const savedIds = await getSavedMovieIds();

        // Faz chamadas concorrentes das 4 primeiras páginas (80 filmes)
        const totalPages = 4;
        const requests = Array.from({ length: totalPages }, (_, i) => {
          const url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=${ids}&language=pt-BR&sort_by=popularity.desc&include_adult=false&page=${i + 1}`;
          return fetch(url).then(r => r.json());
        });

        const responses = await Promise.all(requests);
        const uniqueMovies = new Map();

        responses.forEach(data => {
          if (data.results) {
            data.results.forEach(m => {
              if (m.poster_path && !uniqueMovies.has(m.id)) {
                uniqueMovies.set(m.id, m);
              }
            });
          }
        });

        const results = Array.from(uniqueMovies.values());

        if (results.length === 0) {
          discoverStatus.innerHTML = `<i class="fa-solid fa-frown"></i><p>Nenhum filme encontrado para essas categorias.</p>`;
          return;
        }

        discoverStatus.style.display = "none";

        results.forEach(movie => {
          const card = document.createElement("div");
          card.className = "movie-card";
          const cover = `${BASE_IMAGE_URL}${movie.poster_path}`;
          const isSaved = savedIds.has(Number(movie.id));

          card.innerHTML = `
            <div class="poster-container">
              <img src="${cover}" alt="${movie.title}">
            </div>
            <div class="movie-info">
              <h3>${movie.title}</h3>
              ${isSaved
              ? `<button class="btn-primary btn-already-added" style="width:100%; height: 32px; font-size:0.75rem;" disabled>
                    <i class="fa-solid fa-check"></i> Na Lista
                   </button>`
              : `<button class="btn-primary add-discover-btn" style="width:100%; height: 32px; font-size:0.75rem;" 
                        data-id="${movie.id}" data-title="${movie.title.replace(/"/g, '&quot;')}" data-cover="${cover}">
                    <i class="fa-solid fa-plus"></i> Adicionar
                   </button>`
            }
            </div>
          `;

          const addBtn = card.querySelector('.add-discover-btn');
          if (addBtn) {
            addBtn.onclick = async (e) => {
              const btn = e.currentTarget;
              btn.disabled = true;
              btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

              const movieObj = {
                tmdb_id: Number(btn.dataset.id),
                name: btn.dataset.title,
                cover: btn.dataset.cover,
                status: "proximo",
                rating: 0,
                userId: USER_ID
              };

              const currentSavedIds = await getSavedMovieIds();
              if (currentSavedIds.has(movieObj.tmdb_id)) {
                alert("Este filme já está na sua lista!");
              } else {
                await set(push(ref(db, `user_movies/${USER_ID}`)), movieObj);
                renderUserList();
              }

              btn.className = "btn-primary btn-already-added";
              btn.innerHTML = `<i class="fa-solid fa-check"></i> Na Lista`;
            };
          }

          discoverGrid.appendChild(card);
        });

      } catch (err) {
        console.error("Erro na busca por gêneros:", err);
        discoverStatus.innerHTML = `<i class="fa-solid fa-exclamation-triangle"></i><p>Ocorreu um erro ao buscar sugestões.</p>`;
      }
    };
  </script>
