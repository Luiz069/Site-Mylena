<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Jogos</title>

    <!-- Fonte Segoe UI / Inter para visual limpo de console -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase v8 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --xbox-black: #0f1011;
            --xbox-dark: #181a1d;
            --xbox-card: #202327;
            --xbox-card-hover: #2a2e33;
            --xbox-green: #107c41;
            --xbox-green-hover: #13924d;
            --xbox-green-light: #6cc070;

            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);

            --radius-sm: 4px;
            --radius-md: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--xbox-black);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* HEADER XBOX STYLE */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 16px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title i {
            color: var(--xbox-green-light);
            font-size: 1.8rem;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }

        .header-tag {
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(16, 124, 65, 0.2);
            color: var(--xbox-green-light);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(16, 124, 65, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* PLACAR VERSUS (PAINEL DE ESTATÍSTICAS DO CONSOLE) */
        .versus-card {
            background: var(--xbox-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
        }

        .versus-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .versus-header i {
            color: var(--xbox-green-light);
        }

        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        .player-box {
            background: var(--xbox-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            position: relative;
        }

        .player-box h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .score-count {
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        .score-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }

        .btn-score {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            width: 36px;
            height: 32px;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-score:hover {
            background: var(--xbox-green);
            border-color: var(--xbox-green);
        }

        .vs-divider {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* BARRA DE PESQUISA (ESTILO CONSOLE SEARCH) */
        .search-section {
            position: relative;
        }

        .search-box {
            display: flex;
            background: var(--xbox-dark);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--xbox-green-light);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .search-box input::placeholder {
            color: #6b7280;
        }

        .btn-search {
            background: var(--xbox-green);
            color: white;
            border: none;
            padding: 0 24px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-search:hover {
            background: var(--xbox-green-hover);
        }

        /* DROPDOWN DE RESULTADOS DA BUSCA */
        .results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: var(--xbox-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-top: 8px;
            max-height: 360px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            display: none;
        }

        .results-dropdown.active {
            display: block;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s;
        }

        .result-item:hover {
            background: var(--xbox-card);
            border-left: 4px solid var(--xbox-green-light);
        }

        .result-item img {
            width: 48px;
            height: 64px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .result-item-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .result-item-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* GRADE DA BIBLIOTECA (XBOX GAME PASS STYLE) */
        .library-section-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .game-card {
            background: var(--xbox-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--xbox-green-light);
        }

        .game-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .game-info {
            padding: 12px 14px;
            background: var(--xbox-dark);
        }

        .game-info h4 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-remove {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 16, 17, 0.85);
            border: 1px solid var(--border-color);
            color: #ef4444;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: background 0.15s;
        }

        .btn-remove:hover {
            background: #ef4444;
            color: #fff;
        }

        @media (min-width: 550px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HEADER ESTILO XBOX -->
        <header>
            <div class="header-title">
                <i class="fa-brands fa-xbox"></i>
                <h1>Minha Biblioteca</h1>
            </div>
            <span class="header-tag">Casal Hub</span>
        </header>

        <!-- PAINEL DE PONTUAÇÃO (PLACAR) -->
        <div class="versus-card">
            <div class="versus-header">
                <i class="fa-solid fa-chart-simple"></i>
                <span>Histórico de Vitórias</span>
            </div>

            <div class="scoreboard">
                <div class="player-box">
                    <h3 id="p1-name">Luiz</h3>
                    <div class="score-count" id="p1-score">0</div>
                    <div class="score-controls">
                        <button class="btn-score" onclick="alterarPontos('p1', -1)">-</button>
                        <button class="btn-score" onclick="alterarPontos('p1', 1)">+</button>
                    </div>
                </div>

                <div class="vs-divider">VS</div>

                <div class="player-box">
                    <h3 id="p2-name">Mylena</h3>
                    <div class="score-count" id="p2-score">0</div>
                    <div class="score-controls">
                        <button class="btn-score" onclick="alterarPontos('p2', -1)">-</button>
                        <button class="btn-score" onclick="alterarPontos('p2', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- BUSCA DE JOGOS DA ATUALIDADE -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="game-search-input" placeholder="Buscar jogo para adicionar...">
                <button class="btn-search" onclick="buscarJogo()">
                    <i class="fa-solid fa-magnifying-glass"></i> Buscar
                </button>
            </div>

            <div class="results-dropdown" id="results-dropdown"></div>
        </div>

        <!-- CATALOGO SALVO -->
        <div>
            <div class="library-section-title">Jogos Instalados / Salvos</div>
            <div class="games-grid" id="games-grid"></div>
        </div>

    </div>

    <script>
        // CHAVE DA API DA RAWG (Insira sua chave aqui)
        const RAWG_API_KEY = "f30fd9bcf3e04423888e103116615218";

        // CONFIGURAÇÃO DO SEU FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCJQZ3Pswe6sdsE35wJux8Dgbw_2PaNNOA",
            authDomain: "filmes-salvos.firebaseapp.com",
            databaseURL: "https://filmes-salvos-default-rtdb.firebaseio.com",
            projectId: "filmes-salvos",
            storageBucket: "filmes-salvos.firebasestorage.app",
            messagingSenderId: "155114516613",
            appId: "1:155114516613:web:f0333b9391a7851ad1b9ec",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. PLACAR EM TEMPO REAL
        const versusRef = db.ref('hub_games/placar');
        versusRef.on('value', (snapshot) => {
            const data = snapshot.val() || { p1: 0, p2: 0 };
            document.getElementById('p1-score').textContent = data.p1 || 0;
            document.getElementById('p2-score').textContent = data.p2 || 0;
        });

        function alterarPontos(jogador, delta) {
            versusRef.child(jogador).transaction((valor) => {
                const novo = (valor || 0) + delta;
                return novo < 0 ? 0 : novo;
            });
        }

        // 2. BUSCAR JOGOS DA ATUALIDADE (RAWG API)
        async function buscarJogo() {
            const query = document.getElementById('game-search-input').value.trim();
            const dropdown = document.getElementById('results-dropdown');

            if (!query) return;

            dropdown.innerHTML = '<div style="padding:14px; color:var(--text-muted); font-size:0.85rem;">Pesquisando base de dados...</div>';
            dropdown.classList.add('active');

            try {
                const response = await fetch(`https://api.rawg.io/api/games?key=${RAWG_API_KEY}&search=${encodeURIComponent(query)}&page_size=5`);
                const data = await response.json();
                const games = data.results || [];

                dropdown.innerHTML = '';

                if (games.length === 0) {
                    dropdown.innerHTML = '<div style="padding:14px; color:var(--text-muted); font-size:0.85rem;">Nenhum jogo encontrado.</div>';
                    return;
                }

                games.forEach(game => {
                    const ano = game.released ? game.released.split('-')[0] : 'N/A';
                    const capa = game.background_image || 'https://via.placeholder.com/300x400?text=Sem+Capa';

                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerHTML = `
            <img src="${capa}" alt="${game.name}">
            <div class="result-item-info">
              <h4>${game.name}</h4>
              <span>Lançamento: ${ano}</span>
            </div>
          `;
                    item.onclick = () => salvarJogo(game.name, capa, ano);
                    dropdown.appendChild(item);
                });

            } catch (e) {
                console.error("Erro na busca de jogos:", e);
                dropdown.innerHTML = '<div style="padding:14px; color:var(--text-muted); font-size:0.85rem;">Erro de conexão com a RAWG API.</div>';
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-section')) {
                document.getElementById('results-dropdown').classList.remove('active');
            }
        });

        // 3. SALVAR E EXIBIR JOGOS NO FIREBASE
        const gamesRef = db.ref('hub_games/biblioteca');

        function salvarJogo(titulo, capa, ano) {
            gamesRef.push({
                title: titulo,
                poster: capa,
                year: ano,
                addedAt: Date.now()
            });

            document.getElementById('results-dropdown').classList.remove('active');
            document.getElementById('game-search-input').value = '';
        }

        gamesRef.on('value', (snapshot) => {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: left; color: var(--text-muted); font-size:0.85rem; padding: 12px 0;">Nenhum jogo salvo na biblioteca. Use a busca acima para adicionar.</div>';
                return;
            }

            Object.entries(data).forEach(([key, game]) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
          <button class="btn-remove" onclick="removerJogo('${key}')"><i class="fa-solid fa-xmark"></i></button>
          <img src="${game.poster}" alt="${game.title}">
          <div class="game-info">
            <h4>${game.title}</h4>
            <p>${game.year ? game.year : 'Catalogado'}</p>
          </div>
        `;
                grid.appendChild(card);
            });
        });

        function removerJogo(id) {
            if (confirm("Remover este jogo da coleção?")) {
                gamesRef.child(id).remove();
            }
        }
    </script>
</body>

</html>
