<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CineTimeline - Multiplayer</title>

  <!-- Fontes e Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase v8 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #0d0b18;
      --card-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(255, 255, 255, 0.08);
      --accent: #ff3c00;
      --accent-hover: #ff5522;
      --text: #ffffff;
      --text-muted: #9e9ea0;
      --success: #28a745;
      --danger: #dc3545;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
      touch-action: manipulation;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* LOBBY / TELA INICIAL */
    .screen {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input,
    select {
      height: 44px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text);
      padding: 0 14px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      height: 46px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
    }

    /* SALA DE ESPERA */
    .room-code-badge {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffb703;
      text-align: center;
      letter-spacing: 2px;
    }

    .players-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0;
    }

    .player-item {
      background: var(--input-bg);
      padding: 8px 12px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* JOGO */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: var(--radius-md);
    }

    .room-tag {
      font-weight: 800;
      color: #ffb703;
      font-size: 0.9rem;
    }

    .timeline-instructions {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0 4px;
    }

    /* LAYOUT EM GRID PARA OS CARDS */
    .timeline-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 6px 0;
      width: 100%;
    }

    .movie-card {
      background: var(--card-bg);
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none;
      user-select: none;
      position: relative;
      cursor: grab;
      overflow: hidden;
    }

    .movie-card.dragging {
      opacity: 0.4;
      border-color: var(--accent);
    }

    /* ESTILO PROPORCIONAL PARA CARTAZES DE CINEMA */
    .movie-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      pointer-events: none;
      background: #1a172e;
    }

    .movie-card h4 {
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
      height: 2.2em;
      line-height: 1.1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .year-badge {
      display: none;
      margin-top: 6px;
      background: var(--accent);
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .movie-card.correct {
      border-color: var(--success);
      background: rgba(40, 167, 69, 0.15);
    }

    .movie-card.wrong {
      border-color: var(--danger);
      background: rgba(220, 53, 69, 0.15);
    }

    .movie-card.revealed .year-badge {
      display: block;
    }

    /* RANKING / PLACAR NA TELA DO JOGO */
    .scoreboard {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 10px;
      border: 1px solid var(--glass-border);
    }

    .scoreboard h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    @media (min-width: 520px) {
      .timeline-list {
        grid-template-columns: repeat(4, 1fr);
      }

      .movie-card img {
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1><i class="fa-solid fa-film"></i> CineTimeline</h1>
    <p>Multiplayer Simultâneo</p>
  </header>

  <div class="container">

    <!-- TELA 1: LOGIN -->
    <div id="screen-login" class="screen active">
      <div class="input-group">
        <label>Seu Apelido</label>
        <input type="text" id="player-name" placeholder="Ex: Lucas" maxlength="12">
      </div>

      <button class="btn" id="btn-create-room"><i class="fa-solid fa-plus"></i> Criar Nova Sala</button>

      <div style="text-align: center; color: var(--text-muted); font-size: 0.75rem; margin: 2px 0;">OU</div>

      <div class="input-group">
        <label>Código da Sala</label>
        <input type="text" id="room-code-input" placeholder="Ex: A1B2" style="text-transform: uppercase;">
      </div>
      <button class="btn btn-secondary" id="btn-join-room"><i class="fa-solid fa-right-to-bracket"></i> Entrar na
        Sala</button>
    </div>

    <!-- TELA 2: LOBBY -->
    <div id="screen-lobby" class="screen">
      <div style="text-align: center;">
        <span style="font-size: 0.75rem; color: var(--text-muted);">CÓDIGO DA SALA</span>
        <div class="room-code-badge" id="lobby-room-code">----</div>
      </div>

      <div class="input-group" id="host-controls">
        <label>Categoria da Partida</label>
        <select id="lobby-theme">
          <option value="geral">Todas as Categorias</option>
          <option value="acao">Ação & Ficção</option>
          <option value="animacao">Animação</option>
          <option value="classicos">Clássicos</option>
          <option value="terror">Terror</option>
        </select>
      </div>

      <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">JOGADORES CONECTADOS:</label>
      <ul class="players-list" id="players-list"></ul>

      <button class="btn" id="btn-start-game" style="display: none;"><i class="fa-solid fa-play"></i> Iniciar
        Jogo</button>
      <div id="waiting-msg" style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">Aguardando o
        criador iniciar a partida...</div>
    </div>

    <!-- TELA 3: ÁREA DE JOGO -->
    <div id="screen-game" class="screen">
      <div class="hud">
        <div class="room-tag" id="hud-room">SALA: ----</div>
        <div id="status-msg" style="font-size: 0.8rem; font-weight: 700; color: #ffb703;">Valendo!</div>
      </div>

      <div class="timeline-instructions">
        <span>1º (Mais Antigo)</span>
        <span>4º (Mais Recente)</span>
      </div>

      <div class="timeline-list" id="timeline"></div>

      <button class="btn" id="btn-submit"><i class="fa-solid fa-check"></i> Enviar Minha Ordem</button>

      <div class="scoreboard">
        <h3><i class="fa-solid fa-trophy"></i> Placar ao Vivo</h3>
        <ul class="players-list" id="live-scoreboard"></ul>
      </div>
    </div>

  </div>

  <script>
    // ====================================================
    // CONFIGURAÇÃO DO FIREBASE (SUBSTITUA PELOS SEUS DADOS)
    // ====================================================
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
      projectId: "SEU_PROJETO",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // BANCO DE FILMES COM LINKS PARA OS CARTAZES OFICIAIS
    const DB_FILMES = [
      {
        title: "Star Wars: Episódio IV",
        year: 1977,
        poster: "https://upload.wikimedia.org/wikipedia/commons/6/6c/Star_Wars_A_New_Hope_poster.png"
      },
      {
        title: "Exterminador do Futuro 2",
        year: 1991,
        poster: "https://upload.wikimedia.org/wikipedia/pt/8/85/Terminator2poster.jpg"
      },
      {
        title: "Matrix",
        year: 1999,
        poster: "https://upload.wikimedia.org/wikipedia/pt/c/c1/Matrix-poster.png"
      },
      {
        title: "Batman: O Cavaleiro das Trevas",
        year: 2008,
        poster: "https://upload.wikimedia.org/wikipedia/pt/d/d1/The_Dark_Knight.jpg"
      },
      {
        title: "Vingadores: Ultimato",
        year: 2019,
        poster: "https://upload.wikimedia.org/wikipedia/pt/9/9b/Avengers_Endgame.jpg"
      },
      {
        title: "Top Gun: Maverick",
        year: 2022,
        poster: "https://upload.wikimedia.org/wikipedia/pt/d/d2/Top_Gun_Maverick_Poster.jpg"
      },
      {
        title: "O Rei Leão",
        year: 1994,
        poster: "https://upload.wikimedia.org/wikipedia/pt/3/3d/The_Lion_King_poster.jpg"
      },
      {
        title: "Shrek",
        year: 2001,
        poster: "https://upload.wikimedia.org/wikipedia/pt/b/b0/Shrek_p%C3%B4ster.jpg"
      },
      {
        title: "Toy Story",
        year: 1995,
        poster: "https://upload.wikimedia.org/wikipedia/pt/d/dc/Toy_Story_1995.jpg"
      },
      {
        title: "Avatar",
        year: 2009,
        poster: "https://upload.wikimedia.org/wikipedia/pt/b/b0/Avatar-Teaser-Poster.jpg"
      },
      {
        title: "O Poderoso Chefão",
        year: 1972,
        poster: "https://upload.wikimedia.org/wikipedia/pt/1/15/Godfather_v_1.jpg"
      },
      {
        title: "Titanic",
        year: 1997,
        poster: "https://upload.wikimedia.org/wikipedia/pt/2/22/Titanic_poster.jpg"
      },
      {
        title: "Oppenheimer",
        year: 2023,
        poster: "https://upload.wikimedia.org/wikipedia/pt/3/3d/Oppenheimer_poster.jpg"
      },
      {
        title: "Jurassic Park",
        year: 1993,
        poster: "https://upload.wikimedia.org/wikipedia/pt/e/e7/Jurassic_Park_poster.jpg"
      }
    ];

    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 6);
    let myName = '';
    let currentRoomCode = null;
    let isHost = false;
    let draggedItem = null;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // CRIAR SALA
    document.getElementById('btn-create-room').addEventListener('click', () => {
      myName = document.getElementById('player-name').value.trim() || 'Jogador';
      currentRoomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      isHost = true;

      const roomRef = db.ref('rooms/' + currentRoomCode);
      roomRef.set({
        status: 'waiting',
        host: myPlayerId,
        players: {
          [myPlayerId]: { name: myName, score: 0, ready: false }
        }
      });

      setupLobby();
    });

    // ENTRAR NA SALA
    document.getElementById('btn-join-room').addEventListener('click', () => {
      myName = document.getElementById('player-name').value.trim() || 'Jogador';
      currentRoomCode = document.getElementById('room-code-input').value.trim().toUpperCase();

      if (!currentRoomCode) return alert("Digite o código da sala!");

      const roomRef = db.ref('rooms/' + currentRoomCode);
      roomRef.once('value', (snapshot) => {
        if (!snapshot.exists()) return alert("Sala não encontrada!");

        db.ref(`rooms/${currentRoomCode}/players/${myPlayerId}`).set({
          name: myName,
          score: 0,
          ready: false
        });

        setupLobby();
      });
    });

    function setupLobby() {
      showScreen('screen-lobby');
      document.getElementById('lobby-room-code').textContent = currentRoomCode;

      if (isHost) {
        document.getElementById('host-controls').style.display = 'block';
        document.getElementById('btn-start-game').style.display = 'flex';
        document.getElementById('waiting-msg').style.display = 'none';
      } else {
        document.getElementById('host-controls').style.display = 'none';
        document.getElementById('btn-start-game').style.display = 'none';
        document.getElementById('waiting-msg').style.display = 'block';
      }

      db.ref(`rooms/${currentRoomCode}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const list = document.getElementById('players-list');
        list.innerHTML = '';
        Object.values(data.players || {}).forEach(p => {
          list.innerHTML += `<li class="player-item"><span>${p.name}</span><span>Pontos: ${p.score || 0}</span></li>`;
        });

        if (data.status === 'playing') {
          setupGameScreen(data.currentRound);
        }
      });
    }

    // INICIAR PARTIDA
    document.getElementById('btn-start-game').addEventListener('click', () => {
      const roundMovies = [...DB_FILMES].sort(() => 0.5 - Math.random()).slice(0, 4);

      db.ref(`rooms/${currentRoomCode}`).update({
        status: 'playing',
        currentRound: {
          movies: roundMovies,
          startTime: Date.now()
        }
      });
    });

    function setupGameScreen(roundData) {
      showScreen('screen-game');
      document.getElementById('hud-room').textContent = `SALA: ${currentRoomCode}`;
      document.getElementById('btn-submit').disabled = false;
      document.getElementById('status-msg').textContent = "Ordene o mais rápido possível!";

      renderCards(roundData.movies);

      db.ref(`rooms/${currentRoomCode}/players`).on('value', (snapshot) => {
        const players = snapshot.val() || {};
        const scoreboard = document.getElementById('live-scoreboard');
        scoreboard.innerHTML = '';

        Object.values(players)
          .sort((a, b) => (b.score || 0) - (a.score || 0))
          .forEach(p => {
            const statusText = p.done ? '✅ Enviou' : '⏳ Jogando...';
            scoreboard.innerHTML += `<li class="player-item"><span>${p.name}</span><span>${statusText} | ${p.score || 0} pts</span></li>`;
          });
      });
    }

    // RENDERIZAR OS CARDS DAS CAPAS
    function renderCards(movies) {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';

      movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.dataset.year = movie.year;

        card.innerHTML = `
          <img src="${movie.poster}" alt="${movie.title}" loading="lazy" crossorigin="anonymous">
          <h4>${movie.title}</h4>
          <span class="year-badge">${movie.year}</span>
        `;

        attachDragAndTouch(card);
        timeline.appendChild(card);
      });
    }

    // REORDENAR POR TOUCH (ARRASTAR CARD)
    function attachDragAndTouch(card) {
      card.addEventListener('touchstart', () => {
        draggedItem = card;
        card.classList.add('dragging');
      }, { passive: true });

      card.addEventListener('touchend', () => {
        if (draggedItem) draggedItem.classList.remove('dragging');
        draggedItem = null;
      });

      card.addEventListener('touchmove', (e) => {
        if (!draggedItem) return;
        const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        const targetCard = target ? target.closest('.movie-card') : null;

        if (targetCard && targetCard !== draggedItem) {
          const all = [...document.querySelectorAll('.movie-card')];
          if (all.indexOf(draggedItem) < all.indexOf(targetCard)) {
            targetCard.after(draggedItem);
          } else {
            targetCard.before(draggedItem);
          }
        }
      }, { passive: true });
    }

    // ENVIAR RESPOSTA
    document.getElementById('btn-submit').addEventListener('click', () => {
      const cards = [...document.querySelectorAll('.movie-card')];
      const years = cards.map(c => parseInt(c.dataset.year));

      let correct = true;
      for (let i = 0; i < years.length - 1; i++) {
        if (years[i] > years[i + 1]) { correct = false; break; }
      }

      cards.forEach(c => {
        c.classList.add('revealed', correct ? 'correct' : 'wrong');
      });

      document.getElementById('btn-submit').disabled = true;

      if (correct) {
        db.ref(`rooms/${currentRoomCode}/players/${myPlayerId}`).transaction(player => {
          if (player) {
            player.score = (player.score || 0) + 10;
            player.done = true;
          }
          return player;
        });
        document.getElementById('status-msg').textContent = "🎉 Você acertou! +10 Pts";
      } else {
        db.ref(`rooms/${currentRoomCode}/players/${myPlayerId}/done`).set(true);
        document.getElementById('status-msg').textContent = "❌ Você errou!";
      }
    });
  </script>
</body>

</html>
