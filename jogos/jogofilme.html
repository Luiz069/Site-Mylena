<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CineTimeline - Multiplayer</title>

  <!-- Fontes e Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase v8 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #0d0b18;
      --card-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(255, 255, 255, 0.08);
      --accent: #ff3c00;
      --accent-hover: #ff5522;
      --text: #ffffff;
      --text-muted: #9e9ea0;
      --success: #28a745;
      --danger: #dc3545;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      touch-action: manipulation;
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 2rem; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 10px; }
    header p { font-size: 0.85rem; color: var(--text-muted); }

    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 16px; }

    /* LOBBY / TELA INICIAL */
    .screen { display: none; background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 20px; }
    .screen.active { display: flex; flex-direction: column; gap: 14px; }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    
    input, select {
      height: 44px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text);
      padding: 0 14px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      height: 46px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary { background: var(--input-bg); border: 1px solid var(--glass-border); }

    /* SALA DE ESPERA */
    .room-code-badge { font-size: 1.5rem; font-weight: 800; color: #ffb703; text-align: center; letter-spacing: 2px; }
    .players-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .player-item { background: var(--input-bg); padding: 10px 14px; border-radius: var(--radius-md); display: flex; justify-content: space-between; font-weight: 700; }

    /* JOGO */
    .hud { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px; border-radius: var(--radius-md); }
    .room-tag { font-weight: 800; color: #ffb703; }

    .timeline-instructions { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; padding: 0 8px; }
    .timeline-list { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; min-height: 260px; justify-content: center; align-items: center; }

    .movie-card {
      background: var(--card-bg);
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-lg);
      width: 150px;
      flex-shrink: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none;
      user-select: none;
    }

    .movie-card.dragging { opacity: 0.5; transform: scale(1.05); }
    .movie-card img { width: 100%; height: 180px; object-fit: cover; border-radius: var(--radius-md); pointer-events: none; }
    .movie-card h4 { font-size: 0.8rem; margin-top: 8px; text-align: center; height: 2.4em; overflow: hidden; }
    .year-badge { display: none; margin-top: 4px; background: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; }

    .movie-card.correct { border-color: var(--success); }
    .movie-card.wrong { border-color: var(--danger); }
    .movie-card.revealed .year-badge { display: block; }

    /* RANKING / PLACAR NA TELA DO JOGO */
    .scoreboard { background: var(--card-bg); border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--glass-border); }
    .scoreboard h3 { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }

    @media (max-width: 600px) {
      .timeline-list { justify-content: flex-start; }
      .movie-card { width: 130px; }
      .movie-card img { height: 150px; }
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-film"></i> CineTimeline</h1>
    <p>Multiplayer Simultâneo em Tempo Real</p>
  </header>

  <div class="container">

    <!-- TELA 1: LOGIN / CONFIGURAÇÃO DE ENTRADA -->
    <div id="screen-login" class="screen active">
      <div class="input-group">
        <label>Seu Apelido</label>
        <input type="text" id="player-name" placeholder="Ex: Lucas" maxlength="12">
      </div>

      <button class="btn" id="btn-create-room"><i class="fa-solid fa-plus"></i> Criar Nova Sala</button>

      <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 4px 0;">OU</div>

      <div class="input-group">
        <label>Código da Sala</label>
        <input type="text" id="room-code-input" placeholder="Ex: A1B2" style="text-transform: uppercase;">
      </div>
      <button class="btn btn-secondary" id="btn-join-room"><i class="fa-solid fa-right-to-bracket"></i> Entrar na Sala</button>
    </div>

    <!-- TELA 2: LOBBY DE ESPERA DA SALA -->
    <div id="screen-lobby" class="screen">
      <div style="text-align: center;">
        <span style="font-size: 0.8rem; color: var(--text-muted);">CÓDIGO DA SALA</span>
        <div class="room-code-badge" id="lobby-room-code">----</div>
      </div>

      <div class="input-group" id="host-controls">
        <label>Categoria da Partida</label>
        <select id="lobby-theme">
          <option value="geral">Todas as Categorias</option>
          <option value="acao">Ação & Ficção</option>
          <option value="animacao">Animação</option>
          <option value="classicos">Clássicos</option>
          <option value="terror">Terror</option>
        </select>
      </div>

      <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">JOGADORES CONECTADOS:</label>
      <ul class="players-list" id="players-list"></ul>

      <button class="btn" id="btn-start-game" style="display: none;"><i class="fa-solid fa-play"></i> Iniciar Jogo</button>
      <div id="waiting-msg" style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">Aguardando o criador iniciar a partida...</div>
    </div>

    <!-- TELA 3: ÁREA DE JOGO -->
    <div id="screen-game" class="screen">
      <div class="hud">
        <div class="room-tag" id="hud-room">SALA: ----</div>
        <div id="status-msg" style="font-size: 0.85rem; font-weight: 700; color: #ffb703;">Valendo!</div>
      </div>

      <div class="timeline-instructions">
        <span><i class="fa-solid fa-arrow-left"></i> Mais Antigo</span>
        <span>Mais Recente <i class="fa-solid fa-arrow-right"></i></span>
      </div>

      <div class="timeline-list" id="timeline"></div>

      <button class="btn" id="btn-submit"><i class="fa-solid fa-check"></i> Enviar Minha Ordem</button>

      <!-- RANKING EM TEMPO REAL -->
      <div class="scoreboard">
        <h3><i class="fa-solid fa-trophy"></i> Placar ao Vivo</h3>
        <ul class="players-list" id="live-scoreboard"></ul>
      </div>
    </div>

  </div>

  <script>
    // ====================================================
    // CONFIGURAÇÃO DO FIREBASE (SUBSTITUA PELOS SEUS DADOS)
    // ====================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCJQZ3Pswe6sdsE35wJux8Dgbw_2PaNNOA",
      authDomain: "filmes-salvos.firebaseapp.com",
      databaseURL: "https://filmes-salvos-default-rtdb.firebaseio.com",
      projectId: "filmes-salvos",
      storageBucket: "filmes-salvos.firebasestorage.app",
      messagingSenderId: "155114516613",
      appId: "1:155114516613:web:f0333b9391a7851ad1b9ec",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // BANCO DE FILMES
    const DB_FILMES = [
      { title: "Star Wars", year: 1977 }, { title: "O Exterminador do Futuro 2", year: 1991 },
      { title: "Matrix", year: 1999 }, { title: "O Cavaleiro das Trevas", year: 2008 },
      { title: "Vingadores Ultimato", year: 2019 }, { title: "Top Gun Maverick", year: 2022 },
      { title: "O Rei Leão", year: 1994 }, { title: "Shrek", year: 2001 },
      { title: "Toy Story", year: 1995 }, { title: "Avatar", year: 2009 },
      { title: "O Poderoso Chefao", year: 1972 }, { title: "Titanic", year: 1997 },
      { title: "Oppenheimer", year: 2023 }, { title: "Jurassic Park", year: 1993 },
      { title: "Psicose", year: 1960 }, { title: "Corra", year: 2017 }
    ];

    // ESTADO DO JOGO
    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 6);
    let myName = '';
    let currentRoomCode = null;
    let isHost = false;
    let draggedItem = null;

    // TELAS
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // CRIAR SALA
    document.getElementById('btn-create-room').addEventListener('click', () => {
      myName = document.getElementById('player-name').value.trim() || 'Jogador';
      currentRoomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      isHost = true;

      const roomRef = db.ref('rooms/' + currentRoomCode);
      roomRef.set({
        status: 'waiting',
        host: myPlayerId,
        players: {
          [myPlayerId]: { name: myName, score: 0, ready: false }
        }
      });

      setupLobby();
    });

    // ENTRAR NA SALA
    document.getElementById('btn-join-room').addEventListener('click', () => {
      myName = document.getElementById('player-name').value.trim() || 'Jogador';
      currentRoomCode = document.getElementById('room-code-input').value.trim().toUpperCase();

      if (!currentRoomCode) return alert("Digite o código da sala!");

      const roomRef = db.ref('rooms/' + currentRoomCode);
      roomRef.once('value', (snapshot) => {
        if (!snapshot.exists()) return alert("Sala não encontrada!");

        db.ref(`rooms/${currentRoomCode}/players/${myPlayerId}`).set({
          name: myName,
          score: 0,
          ready: false
        });

        setupLobby();
      });
    });

    // ESCUTAR MUDANÇAS NO LOBBY
    function setupLobby() {
      showScreen('screen-lobby');
      document.getElementById('lobby-room-code').textContent = currentRoomCode;

      if (isHost) {
        document.getElementById('host-controls').style.display = 'block';
        document.getElementById('btn-start-game').style.display = 'flex';
        document.getElementById('waiting-msg').style.display = 'none';
      } else {
        document.getElementById('host-controls').style.display = 'none';
        document.getElementById('btn-start-game').style.display = 'none';
        document.getElementById('waiting-msg').style.display = 'block';
      }

      // Sincronizar lista de jogadores e status do jogo
      db.ref(`rooms/${currentRoomCode}`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // Atualizar lista de jogadores
        const list = document.getElementById('players-list');
        list.innerHTML = '';
        Object.values(data.players || {}).forEach(p => {
          list.innerHTML += `<li class="player-item"><span>${p.name}</span><span> Pontos: ${p.score || 0}</span></li>`;
        });

        // Se o host iniciou o jogo
        if (data.status === 'playing') {
          setupGameScreen(data.currentRound);
        }
      });
    }

    // INICIAR PARTIDA (HOST)
    document.getElementById('btn-start-game').addEventListener('click', () => {
      // Sortear 4 filmes para a rodada
      const roundMovies = [...DB_FILMES].sort(() => 0.5 - Math.random()).slice(0, 4);

      db.ref(`rooms/${currentRoomCode}`).update({
        status: 'playing',
        currentRound: {
          movies: roundMovies,
          startTime: Date.now()
        }
      });
    });

    // TELA DE JOGO
    function setupGameScreen(roundData) {
      showScreen('screen-game');
      document.getElementById('hud-room').textContent = `SALA: ${currentRoomCode}`;
      document.getElementById('btn-submit').disabled = false;
      document.getElementById('status-msg').textContent = "Ordene o mais rápido possível!";

      // Renderiza os cards para todos
      renderCards(roundData.movies);

      // Atualiza placar ao vivo
      db.ref(`rooms/${currentRoomCode}/players`).on('value', (snapshot) => {
        const players = snapshot.val() || {};
        const scoreboard = document.getElementById('live-scoreboard');
        scoreboard.innerHTML = '';

        Object.values(players)
          .sort((a,b) => (b.score || 0) - (a.score || 0))
          .forEach(p => {
            const statusText = p.done ? '✅ Enviou' : '⏳ Jogando...';
            scoreboard.innerHTML += `<li class="player-item"><span>${p.name}</span><span>${statusText} | ${p.score || 0} pts</span></li>`;
          });
      });
    }

    function renderCards(movies) {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';

      movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.dataset.year = movie.year;

        card.innerHTML = `
          <img src="https://via.placeholder.com/150x180/1a172e/ffffff?text=${encodeURIComponent(movie.title)}" alt="${movie.title}">
          <h4>${movie.title}</h4>
          <span class="year-badge">${movie.year}</span>
        `;

        attachDragAndTouch(card);
        timeline.appendChild(card);
      });
    }

    // ARRASTAR E SOLTAR (DESKTOP E MOBILE)
    function attachDragAndTouch(card) {
      card.addEventListener('touchstart', () => { draggedItem = card; card.classList.add('dragging'); }, {passive: true});
      card.addEventListener('touchend', () => { if(draggedItem) draggedItem.classList.remove('dragging'); draggedItem = null; });

      card.addEventListener('touchmove', (e) => {
        if (!draggedItem) return;
        const target = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
        const targetCard = target ? target.closest('.movie-card') : null;

        if (targetCard && targetCard !== draggedItem) {
          const all = [...document.querySelectorAll('.movie-card')];
          if (all.indexOf(draggedItem) < all.indexOf(targetCard)) {
            targetCard.after(draggedItem);
          } else {
            targetCard.before(draggedItem);
          }
        }
      }, {passive: true});
    }

    // ENVIAR RESPOSTA DA RODADA
    document.getElementById('btn-submit').addEventListener('click', () => {
      const cards = [...document.querySelectorAll('.movie-card')];
      const years = cards.map(c => parseInt(c.dataset.year));

      let correct = true;
      for (let i = 0; i < years.length - 1; i++) {
        if (years[i] > years[i + 1]) { correct = false; break; }
      }

      cards.forEach(c => {
        c.classList.add('revealed', correct ? 'correct' : 'wrong');
      });

      document.getElementById('btn-submit').disabled = true;

      // Se acertou, incrementa pontos no Firebase
      if (correct) {
        db.ref(`rooms/${currentRoomCode}/players/${myPlayerId}`).transaction(player => {
          if (player) {
            player.score = (player.score || 0) + 10;
            player.done = true;
          }
          return player;
        });
        document.getElementById('status-msg').textContent = "🎉 Você acertou! +10 Pts";
      } else {
        db.ref(`rooms/${currentRoomCode}/players/${myPlayerId}/done`).set(true);
        document.getElementById('status-msg').textContent = "❌ Você errou!";
      }
    });
  </script>
</body>
</html>
